<svg width="1800" height="640" viewBox="0 0 1800 640" xmlns="http://www.w3.org/2000/svg">
  <rect width="1800" height="640" fill="#0D0D0D"/>
  
  <!-- SCREEN 1: THE MASTER ARCHITECT (Refined #1) -->
  <g transform="translate(0,0)">
    <rect width="358" height="638" x="1" y="1" rx="20" fill="black" stroke="#222" stroke-width="2"/>
    <text x="24" y="60" fill="white" font-family="sans-serif" font-size="24" font-weight="300">Good evening.</text>
    <text x="24" y="85" fill="#444" font-family="sans-serif" font-size="9" font-weight="bold" letter-spacing="1">1. MASTER ARCHITECT</text>
    
    <defs>
      <linearGradient id="grad1" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" style="stop-color:#1DB954;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#1DB954;stop-opacity:0.3" />
      </linearGradient>
      <linearGradient id="grad2" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" style="stop-color:#F5A623;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#F5A623;stop-opacity:0.3" />
      </linearGradient>
    </defs>

    <!-- App 1 -->
    <rect x="1" y="110" width="10" height="70" fill="url(#grad1)"/>
    <text x="28" y="152" fill="white" font-family="sans-serif-condensed, sans-serif" font-size="26" font-weight="bold" letter-spacing="0.5">Chat</text>
    <text x="336" y="152" fill="#888" font-family="monospace" font-size="11" text-anchor="end" font-weight="bold">NOW</text>
    
    <!-- App 2 -->
    <rect x="1" y="190" width="10" height="70" fill="url(#grad2)"/>
    <text x="28" y="232" fill="white" font-family="sans-serif-condensed, sans-serif" font-size="26" font-weight="bold" letter-spacing="0.5">Messages</text>
    <text x="336" y="232" fill="#888" font-family="monospace" font-size="11" text-anchor="end" font-weight="bold">4M</text>
  </g>

  <!-- SCREEN 2: THE MODERN AURA (Refined #4) -->
  <g transform="translate(360,0)">
    <rect width="358" height="638" x="1" y="1" rx="20" fill="black" stroke="#222" stroke-width="2"/>
    <text x="24" y="60" fill="white" font-family="sans-serif" font-size="24" font-weight="300">Good evening.</text>
    <text x="24" y="85" fill="#444" font-family="sans-serif" font-size="9" font-weight="bold" letter-spacing="1">2. MODERN AURA</text>
    
    <!-- App 1 -->
    <circle cx="44" cy="140" r="22" stroke="#1DB954" stroke-width="2" fill="none" opacity="0.6"/>
    <circle cx="44" cy="140" r="18" fill="#4444ff" opacity="1.0"/>
    <text x="80" y="148" fill="white" font-family="sans-serif" font-size="20" font-weight="400">Chat</text>
    <text x="336" y="148" fill="white" font-family="sans-serif" font-size="22" font-weight="100" text-anchor="end">now</text>

    <!-- App 2 -->
    <circle cx="44" cy="210" r="22" stroke="#F5A623" stroke-width="2" fill="none" opacity="0.4"/>
    <circle cx="44" cy="210" r="18" fill="#4444ff" opacity="0.7"/>
    <text x="80" y="218" fill="white" font-family="sans-serif" font-size="20" font-weight="300" opacity="0.8">Messages</text>
    <text x="336" y="218" fill="white" font-family="sans-serif" font-size="22" font-weight="100" text-anchor="end" opacity="0.6">8m</text>
  </g>

  <!-- SCREEN 3: PRECISION SIDEBAR (Hybrid) -->
  <g transform="translate(720,0)">
    <rect width="358" height="638" x="1" y="1" rx="20" fill="black" stroke="#222" stroke-width="2"/>
    <text x="24" y="60" fill="white" font-family="sans-serif" font-size="24" font-weight="300">Good evening.</text>
    <text x="24" y="85" fill="#444" font-family="sans-serif" font-size="9" font-weight="bold" letter-spacing="1">3. PRECISION SIDEBAR</text>
    
    <!-- App 1 -->
    <rect x="353" y="110" width="6" height="60" rx="3" fill="#1DB954"/>
    <circle cx="36" cy="140" r="18" fill="#444" opacity="0.5"/>
    <text x="64" y="146" fill="white" font-family="sans-serif" font-size="20">Chat</text>
    <text x="64" y="162" fill="#1DB954" font-family="monospace" font-size="10" font-weight="bold">ACTIVE</text>

    <!-- App 2 -->
    <rect x="353" y="190" width="6" height="60" rx="3" fill="#F5A623"/>
    <circle cx="36" cy="220" r="18" fill="#444" opacity="0.3"/>
    <text x="64" y="226" fill="white" font-family="sans-serif" font-size="20" opacity="0.7">Messages</text>
    <text x="64" y="242" fill="#F5A623" font-family="monospace" font-size="10">8M AGO</text>
  </g>

  <!-- SCREEN 4: TYPOGRAPHY FIRST (Minimal) -->
  <g transform="translate(1080,0)">
    <rect width="358" height="638" x="1" y="1" rx="20" fill="black" stroke="#222" stroke-width="2"/>
    <text x="24" y="60" fill="white" font-family="sans-serif" font-size="24" font-weight="300">Good evening.</text>
    <text x="24" y="85" fill="#444" font-family="sans-serif" font-size="9" font-weight="bold" letter-spacing="1">4. TYPOGRAPHY FIRST</text>
    
    <!-- App 1 -->
    <text x="24" y="150" fill="white" font-family="sans-serif" font-size="32" font-weight="900">Chat</text>
    <rect x="24" y="158" width="12" height="3" fill="#1DB954"/>
    <text x="336" y="148" fill="#1DB954" font-family="monospace" font-size="14" text-anchor="end">NOW</text>

    <!-- App 2 -->
    <text x="24" y="220" fill="white" font-family="sans-serif" font-size="28" font-weight="400" opacity="0.8">Messages</text>
    <rect x="24" y="228" width="12" height="3" fill="#F5A623"/>
    <text x="336" y="218" fill="#888" font-family="monospace" font-size="12" text-anchor="end">12M</text>
  </g>

  <!-- SCREEN 5: THE GLASS STATUS (Premium) -->
  <g transform="translate(1440,0)">
    <rect width="358" height="638" x="1" y="1" rx="20" fill="black" stroke="#222" stroke-width="2"/>
    <text x="24" y="60" fill="white" font-family="sans-serif" font-size="24" font-weight="300">Good evening.</text>
    <text x="24" y="85" fill="#444" font-family="sans-serif" font-size="9" font-weight="bold" letter-spacing="1">5. GLASS STATUS</text>
    
    <!-- App 1 Card -->
    <rect x="12" y="110" width="336" height="64" rx="12" fill="#222" fill-opacity="0.5"/>
    <rect x="12" y="110" width="280" height="64" rx="12" fill="#1DB954" fill-opacity="0.1"/>
    <circle cx="44" cy="142" r="18" fill="#1DB954" fill-opacity="0.8"/>
    <text x="76" y="148" fill="white" font-family="sans-serif" font-size="20" font-weight="bold">Chat</text>
    <text x="336" y="148" fill="#1DB954" font-family="sans-serif" font-size="12" text-anchor="end" font-weight="bold">92%</text>

    <!-- App 2 Card -->
    <rect x="12" y="185" width="336" height="64" rx="12" fill="#222" fill-opacity="0.5"/>
    <rect x="12" y="185" width="120" height="64" rx="12" fill="#F5A623" fill-opacity="0.1"/>
    <circle cx="44" cy="217" r="18" fill="#F5A623" fill-opacity="0.6"/>
    <text x="76" y="223" fill="white" font-family="sans-serif" font-size="20" opacity="0.9">Messages</text>
    <text x="336" y="223" fill="#F5A623" font-family="sans-serif" font-size="12" text-anchor="end">41%</text>
  </g>
</svg>
