<svg width="1800" height="640" viewBox="0 0 1800 640" xmlns="http://www.w3.org/2000/svg">
  <rect width="1800" height="640" fill="#111111"/>
  
  <!-- SCREEN 1: ARCHITECT (0-360) -->
  <g transform="translate(0,0)">
    <rect width="358" height="638" x="1" y="1" rx="20" fill="black" stroke="#333" stroke-width="2"/>
    <text x="24" y="60" fill="white" font-family="sans-serif" font-size="24" font-weight="300">Good evening.</text>
    <text x="24" y="90" fill="#555" font-family="sans-serif" font-size="10">1. ARCHITECT</text>
    
    <!-- App 1 -->
    <rect x="1" y="120" width="8" height="50" fill="#1DB954"/>
    <text x="24" y="152" fill="white" font-family="sans-serif-condensed, sans-serif" font-size="22" font-weight="bold">Chat</text>
    <text x="336" y="152" fill="#555" font-family="monospace" font-size="12" text-anchor="end">NOW</text>
    
    <!-- App 2 -->
    <rect x="1" y="180" width="8" height="50" fill="#F5A623"/>
    <text x="24" y="212" fill="white" font-family="sans-serif-condensed, sans-serif" font-size="22" font-weight="bold">Messages</text>
    <text x="336" y="212" fill="#555" font-family="monospace" font-size="12" text-anchor="end">3M</text>
    
    <!-- App 3 -->
    <rect x="1" y="240" width="8" height="50" fill="#E53935"/>
    <text x="24" y="272" fill="white" font-family="sans-serif-condensed, sans-serif" font-size="22" font-weight="bold">Agenda</text>
    <text x="336" y="272" fill="#555" font-family="monospace" font-size="12" text-anchor="end">22M</text>
  </g>

  <!-- SCREEN 2: TIMELINE (360-720) -->
  <g transform="translate(360,0)">
    <rect width="358" height="638" x="1" y="1" rx="20" fill="black" stroke="#333" stroke-width="2"/>
    <text x="24" y="60" fill="white" font-family="sans-serif" font-size="24" font-weight="300">Good evening.</text>
    <text x="24" y="90" fill="#555" font-family="sans-serif" font-size="10">2. TIMELINE</text>
    
    <line x1="40" y1="120" x2="40" y2="400" stroke="#222" stroke-width="2"/>
    
    <!-- App 1 -->
    <circle cx="40" cy="140" r="16" fill="#1DB954" opacity="0.8"/>
    <text x="70" y="148" fill="white" font-family="sans-serif" font-size="18">Chat</text>
    <rect x="280" y="132" width="56" height="20" rx="10" fill="#1DB954" fill-opacity="0.2" stroke="#1DB954" stroke-width="1"/>
    <text x="308" y="146" fill="#1DB954" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">NOW</text>

    <!-- App 2 -->
    <circle cx="40" cy="200" r="16" fill="#F5A623" opacity="0.8"/>
    <text x="70" y="208" fill="white" font-family="sans-serif" font-size="18">Messages</text>
    <rect x="280" y="192" width="56" height="20" rx="10" fill="#F5A623" fill-opacity="0.2" stroke="#F5A623" stroke-width="1"/>
    <text x="308" y="206" fill="#F5A623" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">3M</text>
  </g>

  <!-- SCREEN 3: STATUS FOCUS (720-1080) -->
  <g transform="translate(720,0)">
    <rect width="358" height="638" x="1" y="1" rx="20" fill="black" stroke="#333" stroke-width="2"/>
    <text x="24" y="60" fill="white" font-family="sans-serif" font-size="24" font-weight="300">Good evening.</text>
    <text x="24" y="90" fill="#555" font-family="sans-serif" font-size="10">3. STATUS FOCUS</text>
    
    <!-- App 1 -->
    <rect x="1" y="120" width="2" height="40" fill="#1DB954"/>
    <circle cx="28" cy="140" r="14" fill="#1DB954" opacity="0.6"/>
    <text x="54" y="146" fill="white" font-family="sans-serif" font-size="18">Chat</text>
    <circle cx="105" cy="140" r="4" fill="#1DB954"/>
    <text x="54" y="162" fill="#555" font-family="monospace" font-size="10">just opened</text>

    <!-- App 2 -->
    <rect x="1" y="180" width="2" height="40" fill="#F5A623"/>
    <circle cx="28" cy="200" r="14" fill="#F5A623" opacity="0.6"/>
    <text x="54" y="206" fill="white" font-family="sans-serif" font-size="18">Messages</text>
    <circle cx="150" cy="200" r="4" fill="#F5A623"/>
    <text x="54" y="222" fill="#555" font-family="monospace" font-size="10">3m ago</text>
  </g>

  <!-- SCREEN 4: MODERN SPLIT (1080-1440) -->
  <g transform="translate(1080,0)">
    <rect width="358" height="638" x="1" y="1" rx="20" fill="black" stroke="#333" stroke-width="2"/>
    <text x="24" y="60" fill="white" font-family="sans-serif" font-size="24" font-weight="300">Good evening.</text>
    <text x="24" y="90" fill="#555" font-family="sans-serif" font-size="10">4. MODERN SPLIT</text>
    
    <!-- App 1 -->
    <circle cx="44" cy="140" r="20" fill="#4444ff" opacity="1.0"/>
    <text x="76" y="148" fill="white" font-family="sans-serif" font-size="18">Chat</text>
    <text x="336" y="148" fill="white" font-family="sans-serif" font-size="24" font-weight="100" text-anchor="end">now</text>

    <!-- App 2 -->
    <circle cx="44" cy="200" r="20" fill="#4444ff" opacity="0.6"/>
    <text x="76" y="208" fill="white" font-family="sans-serif" font-size="18" opacity="0.8">Messages</text>
    <text x="336" y="208" fill="white" font-family="sans-serif" font-size="24" font-weight="100" text-anchor="end" opacity="0.6">3m</text>
  </g>

  <!-- SCREEN 5: KINETIC (1440-1800) -->
  <g transform="translate(1440,0)">
    <rect width="358" height="638" x="1" y="1" rx="20" fill="black" stroke="#333" stroke-width="2"/>
    <text x="24" y="60" fill="white" font-family="sans-serif" font-size="24" font-weight="300">Good evening.</text>
    <text x="24" y="90" fill="#555" font-family="sans-serif" font-size="10">5. KINETIC</text>
    
    <!-- App 1 (More padding) -->
    <circle cx="44" cy="150" r="18" fill="#1DB954"/>
    <text x="76" y="156" fill="white" font-family="sans-serif" font-size="20" font-weight="bold">Chat</text>
    <line x1="76" y1="164" x2="140" y2="164" stroke="#1DB954" stroke-width="2"/>

    <!-- App 2 (Less padding) -->
    <circle cx="44" cy="210" r="18" fill="#F5A623"/>
    <text x="76" y="216" fill="white" font-family="sans-serif" font-size="18">Messages</text>
    <line x1="76" y1="224" x2="160" y2="224" stroke="#F5A623" stroke-width="2"/>

    <!-- App 3 (Tight) -->
    <circle cx="44" cy="260" r="18" fill="#E53935"/>
    <text x="76" y="266" fill="white" font-family="sans-serif" font-size="16">Agenda</text>
  </g>
</svg>
