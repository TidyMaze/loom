<svg width="1080" height="640" viewBox="0 0 1080 640" xmlns="http://www.w3.org/2000/svg">
  <rect width="1080" height="640" fill="#030303"/>
  
  <!-- OPTION 1: GLASS PROGRESS + ICON -->
  <g transform="translate(0,0)">
    <rect width="358" height="638" x="1" y="1" rx="24" fill="black" stroke="#1A1A1A" stroke-width="2"/>
    <text x="24" y="60" fill="white" font-family="sans-serif" font-size="24" font-weight="200">Good evening.</text>
    <text x="24" y="85" fill="#444" font-family="sans-serif" font-size="9" font-weight="bold" letter-spacing="1.5">1. GLASS PROGRESS</text>
    
    <!-- App 1 (High Score) -->
    <rect x="12" y="110" width="336" height="64" rx="12" fill="white" fill-opacity="0.08"/>
    <rect x="12" y="110" width="280" height="64" rx="12" fill="#1DB954" fill-opacity="0.15"/>
    <circle cx="44" cy="142" r="20" fill="#4444ff" stroke="#1DB954" stroke-width="2"/>
    <text x="76" y="150" fill="white" font-family="sans-serif" font-size="20" font-weight="500">Chat</text>
    <text x="332" y="148" fill="#1DB954" font-family="monospace" font-size="10" text-anchor="end" font-weight="bold">NOW</text>

    <!-- App 2 (Mid Score) -->
    <rect x="12" y="182" width="336" height="64" rx="12" fill="white" fill-opacity="0.08"/>
    <rect x="12" y="182" width="120" height="64" rx="12" fill="#F5A623" fill-opacity="0.15"/>
    <circle cx="44" cy="214" r="20" fill="#4444ff" stroke="#F5A623" stroke-width="2" opacity="0.7"/>
    <text x="76" y="222" fill="white" font-family="sans-serif" font-size="20" font-weight="400" opacity="0.9">Messages</text>
    <text x="332" y="220" fill="#555" font-family="monospace" font-size="10" text-anchor="end">8M</text>
  </g>

  <!-- OPTION 2: BOLD FROST + SIDE NOTCH -->
  <g transform="translate(360,0)">
    <rect width="358" height="638" x="1" y="1" rx="24" fill="black" stroke="#1A1A1A" stroke-width="2"/>
    <text x="24" y="60" fill="white" font-family="sans-serif" font-size="24" font-weight="200">Good evening.</text>
    <text x="24" y="85" fill="#444" font-family="sans-serif" font-size="9" font-weight="bold" letter-spacing="1.5">2. BOLD FROST</text>
    
    <!-- App 1 -->
    <rect x="12" y="110" width="336" height="72" rx="16" fill="white" fill-opacity="0.05" stroke="white" stroke-opacity="0.1"/>
    <circle cx="48" cy="146" r="20" fill="#4444ff"/>
    <text x="80" y="156" fill="white" font-family="sans-serif" font-size="28" font-weight="900">Chat</text>
    <rect x="344" y="125" width="4" height="42" rx="2" fill="#1DB954"/>

    <!-- App 2 -->
    <rect x="12" y="190" width="336" height="72" rx="16" fill="white" fill-opacity="0.05" stroke="white" stroke-opacity="0.1"/>
    <circle cx="48" cy="226" r="20" fill="#4444ff" opacity="0.6"/>
    <text x="80" y="236" fill="white" font-family="sans-serif" font-size="28" font-weight="200" opacity="0.7">Messages</text>
    <rect x="344" y="205" width="4" height="42" rx="2" fill="#F5A623"/>
  </g>

  <!-- OPTION 3: WATERMARK AURA -->
  <g transform="translate(720,0)">
    <rect width="358" height="638" x="1" y="1" rx="24" fill="black" stroke="#1A1A1A" stroke-width="2"/>
    <text x="24" y="60" fill="white" font-family="sans-serif" font-size="24" font-weight="200">Good evening.</text>
    <text x="24" y="85" fill="#444" font-family="sans-serif" font-size="9" font-weight="bold" letter-spacing="1.5">3. WATERMARK AURA</text>
    
    <defs>
      <filter id="auraGreen" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="blur" />
        <feFlood flood-color="#1DB954" flood-opacity="0.6" result="color" />
        <feComposite in="color" in2="blur" operator="in" result="glow" />
        <feMerge><feMergeNode in="glow" /><feMergeNode in="SourceGraphic" /></feMerge>
      </filter>
      <filter id="auraOrange" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="blur" />
        <feFlood flood-color="#F5A623" flood-opacity="0.6" result="color" />
        <feComposite in="color" in2="blur" operator="in" result="glow" />
        <feMerge><feMergeNode in="glow" /><feMergeNode in="SourceGraphic" /></feMerge>
      </filter>
    </defs>

    <!-- App 1 -->
    <text x="330" y="160" fill="white" fill-opacity="0.08" font-family="sans-serif" font-size="110" font-weight="900" text-anchor="end">92</text>
    <circle cx="44" cy="142" r="20" fill="#4444ff" filter="url(#auraGreen)"/>
    <text x="80" y="152" fill="white" font-family="sans-serif" font-size="24" font-weight="900">Chat</text>

    <!-- App 2 -->
    <text x="330" y="240" fill="white" fill-opacity="0.05" font-family="sans-serif" font-size="110" font-weight="100" text-anchor="end">41</text>
    <circle cx="44" cy="222" r="20" fill="#4444ff" filter="url(#auraOrange)" opacity="0.6"/>
    <text x="80" y="232" fill="white" font-family="sans-serif" font-size="24" font-weight="300" opacity="0.8">Messages</text>
  </g>
</svg>
