    <text x="149" y="563" fill="#fff" font-size="16" text-anchor="middle">M</text>
    <text x="149" y="600" fill="#fff" font-size="13" text-anchor="middle">Messages</text>
    <text x="149" y="625" fill="#1DB954" font-size="9" text-anchor="middle">2M AGO</text>

