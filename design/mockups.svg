    <circle cx="57" cy="555" r="22" fill="#4285f4"/>
    <text x="57" y="563" fill="#fff" font-size="16" text-anchor="middle">C</text>
    <text x="57" y="600" fill="#fff" font-size="13" text-anchor="middle">Chat</text>
    <text x="57" y="625" fill="#1DB954" font-size="9" text-anchor="middle">JUST NOW</text>

    <rect x="107" y="510" width="85" height="140" rx="14" fill="#0f1f15" stroke="#1DB954" stroke-opacity="0.3"/>
