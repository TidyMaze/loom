  <!-- ========== MOCKUP 5: Search-first minimal ========== -->
  <g transform="translate(1300,20)">
    <text x="150" y="20" fill="#888" font-size="14" text-anchor="middle">5. SEARCH-FIRST</text>
    <rect x="0" y="35" width="300" height="640" rx="20" fill="#000" stroke="#333"/>

    <text x="150" y="280" fill="#fff" font-size="28" text-anchor="middle">Good evening.</text>
    <text x="150" y="310" fill="#666" font-size="13" text-anchor="middle">Tuesday · 18:57</text>

    <!-- Cursor / search prompt -->
    <line x1="140" y1="380" x2="140" y2="410" stroke="#1DB954" stroke-width="2">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </line>
    <text x="150" y="445" fill="#444" font-size="11" text-anchor="middle">type to launch</text>

    <!-- Hint at swipe-down list -->
    <line x1="135" y1="640" x2="165" y2="640" stroke="#333" stroke-width="2"/>
    <text x="150" y="660" fill="#333" font-size="9" text-anchor="middle">↓ swipe for list</text>
