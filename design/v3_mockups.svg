<svg width="1800" height="640" viewBox="0 0 1800 640" xmlns="http://www.w3.org/2000/svg">
  <rect width="1800" height="640" fill="#050505"/>
  
  <!-- SCREEN 1: PURE GLASS (Deep #5) -->
  <g transform="translate(0,0)">
    <rect width="358" height="638" x="1" y="1" rx="24" fill="black" stroke="#1A1A1A" stroke-width="2"/>
    <text x="24" y="60" fill="white" font-family="sans-serif" font-size="24" font-weight="200">Good evening.</text>
    <text x="24" y="85" fill="#444" font-family="sans-serif" font-size="9" font-weight="bold" letter-spacing="1.5">1. PURE GLASS</text>
    
    <!-- App 1 (High Score) -->
    <rect x="12" y="110" width="336" height="56" rx="8" fill="white" fill-opacity="0.08"/>
    <rect x="12" y="110" width="280" height="56" rx="8" fill="#1DB954" fill-opacity="0.15"/>
    <text x="32" y="145" fill="#1DB954" font-family="sans-serif" font-size="20" font-weight="600">Chat</text>
    <text x="332" y="145" fill="#1DB954" font-family="monospace" font-size="10" text-anchor="end" font-weight="bold">NOW</text>

    <!-- App 2 (Mid Score) -->
    <rect x="12" y="174" width="336" height="56" rx="8" fill="white" fill-opacity="0.08"/>
    <rect x="12" y="174" width="120" height="56" rx="8" fill="#F5A623" fill-opacity="0.15"/>
    <text x="32" y="209" fill="#F5A623" font-family="sans-serif" font-size="20" font-weight="400">Messages</text>
    <text x="332" y="209" fill="#555" font-family="monospace" font-size="10" text-anchor="end">8M</text>
  </g>

  <!-- SCREEN 2: FROSTED SPLIT (Hybrid 4+5) -->
  <g transform="translate(360,0)">
    <rect width="358" height="638" x="1" y="1" rx="24" fill="black" stroke="#1A1A1A" stroke-width="2"/>
    <text x="24" y="60" fill="white" font-family="sans-serif" font-size="24" font-weight="200">Good evening.</text>
    <text x="24" y="85" fill="#444" font-family="sans-serif" font-size="9" font-weight="bold" letter-spacing="1.5">2. FROSTED SPLIT</text>
    
    <!-- App 1 -->
    <rect x="12" y="110" width="336" height="64" rx="16" fill="white" fill-opacity="0.05" stroke="white" stroke-opacity="0.1"/>
    <text x="32" y="150" fill="white" font-family="sans-serif" font-size="26" font-weight="900">Chat</text>
    <rect x="344" y="125" width="4" height="34" rx="2" fill="#1DB954"/>
    <text x="332" y="148" fill="#1DB954" font-family="sans-serif" font-size="12" text-anchor="end" font-weight="bold">now</text>

    <!-- App 2 -->
    <rect x="12" y="182" width="336" height="64" rx="16" fill="white" fill-opacity="0.05" stroke="white" stroke-opacity="0.1"/>
    <text x="32" y="222" fill="white" font-family="sans-serif" font-size="26" font-weight="300" opacity="0.7">Messages</text>
    <rect x="344" y="197" width="4" height="34" rx="2" fill="#F5A623"/>
  </g>

  <!-- SCREEN 3: NUMERIC WATERMARK (Refined 4) -->
  <g transform="translate(720,0)">
    <rect width="358" height="638" x="1" y="1" rx="24" fill="black" stroke="#1A1A1A" stroke-width="2"/>
    <text x="24" y="60" fill="white" font-family="sans-serif" font-size="24" font-weight="200">Good evening.</text>
    <text x="24" y="85" fill="#444" font-family="sans-serif" font-size="9" font-weight="bold" letter-spacing="1.5">3. NUMERIC WATERMARK</text>
    
    <!-- App 1 -->
    <text x="330" y="160" fill="white" fill-opacity="0.08" font-family="sans-serif" font-size="96" font-weight="900" text-anchor="end">92</text>
    <text x="24" y="145" fill="white" font-family="sans-serif" font-size="34" font-weight="900">Chat</text>
    <circle cx="24" cy="155" r="3" fill="#1DB954"/>

    <!-- App 2 -->
    <text x="330" y="235" fill="white" fill-opacity="0.05" font-family="sans-serif" font-size="96" font-weight="100" text-anchor="end">41</text>
    <text x="24" y="220" fill="white" font-family="sans-serif" font-size="30" font-weight="100" opacity="0.6">Messages</text>
    <circle cx="24" cy="230" r="3" fill="#F5A623"/>
  </g>

  <!-- SCREEN 4: GLASS STACK (Refined 5) -->
  <g transform="translate(1080,0)">
    <rect width="358" height="638" x="1" y="1" rx="24" fill="black" stroke="#1A1A1A" stroke-width="2"/>
    <text x="24" y="60" fill="white" font-family="sans-serif" font-size="24" font-weight="200">Good evening.</text>
    <text x="24" y="85" fill="#444" font-family="sans-serif" font-size="9" font-weight="bold" letter-spacing="1.5">4. GLASS STACK</text>
    
    <!-- App 1 -->
    <rect x="12" y="110" width="336" height="60" rx="10" fill="#1A1A1A" stroke="#222"/>
    <text x="32" y="146" fill="white" font-family="sans-serif" font-size="20" font-weight="bold">Chat</text>
    <rect x="32" y="162" width="280" height="2" fill="#1DB954"/>

    <!-- App 2 -->
    <rect x="12" y="180" width="336" height="60" rx="10" fill="#1A1A1A" stroke="#222"/>
    <text x="32" y="216" fill="white" font-family="sans-serif" font-size="20" opacity="0.8">Messages</text>
    <rect x="32" y="232" width="120" height="2" fill="#F5A623"/>
  </g>

  <!-- SCREEN 5: AURA GLASS (Refined 2+5) -->
  <g transform="translate(1440,0)">
    <rect width="358" height="638" x="1" y="1" rx="24" fill="black" stroke="#1A1A1A" stroke-width="2"/>
    <text x="24" y="60" fill="white" font-family="sans-serif" font-size="24" font-weight="200">Good evening.</text>
    <text x="24" y="85" fill="#444" font-family="sans-serif" font-size="9" font-weight="bold" letter-spacing="1.5">5. AURA GLASS</text>
    
    <!-- App 1 -->
    <rect x="12" y="110" width="336" height="64" rx="32" fill="white" fill-opacity="0.05" stroke="#1DB954" stroke-opacity="0.3"/>
    <circle cx="44" cy="142" r="18" fill="#4444ff"/>
    <text x="76" y="150" fill="white" font-family="sans-serif" font-size="20">Chat</text>
    <text x="320" y="148" fill="#1DB954" font-family="monospace" font-size="10" text-anchor="end" font-weight="bold">NOW</text>

    <!-- App 2 -->
    <rect x="12" y="185" width="336" height="64" rx="32" fill="white" fill-opacity="0.05" stroke="#F5A623" stroke-opacity="0.2"/>
    <circle cx="44" cy="217" r="18" fill="#4444ff" opacity="0.6"/>
    <text x="76" y="225" fill="white" font-family="sans-serif" font-size="20" opacity="0.7">Messages</text>
    <text x="320" y="223" fill="#555" font-family="monospace" font-size="10" text-anchor="end">8M</text>
  </g>
</svg>
