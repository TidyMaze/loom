AutoName: Loom
Summary: Minimal Android launcher that quietly learns how you use your phone
Description: |-
  A minimal Android launcher that quietly learns how you use your phone.

  No folders. No widgets. No badges. Just a dark grid of app icons, ranked
  by what you are most likely to need right now based on time of day, day
  of the week, and past habits.

  Features:
  * Smart ranking powered by an offline, on-device scoring engine
  * 100% private: no internet permission, no telemetry, zero tracking
  * Instant fuzzy search accessible from anywhere
  * OLED-friendly pure black aesthetic
  * Full functionality without runtime permissions

